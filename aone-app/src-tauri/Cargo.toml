[package]
name = "aone-app"
version = "0.1.0"
description = "Aone - 대학생 학습 에이전트"
authors = ["Aone"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aone_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
dirs = "5"
notify = "6"
notify-debouncer-mini = "0.4"
rfd = "0.15"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
